<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>7 NOTES — Live Jamming Session</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1536px;
    height: 1024px;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: #0a0a0f;
    color: #ffffff;
  }

  /* ═══ STATIC ARTWORK BACKGROUND ═══ */
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 1536px;
    height: 1024px;
    display: block;
  }

  /* ═══ ATTENDEE FIELDS — EXACT COORDINATES ═══ */

  .field-name {
    position: absolute;
    left: 1180px;
    top: 125px;
    width: 280px;
    height: 45px;
    z-index: 1;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .field-gender {
    position: absolute;
    left: 1180px;
    top: 255px;
    width: 280px;
    height: 45px;
    z-index: 1;
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .field-email {
    position: absolute;
    left: 1180px;
    top: 390px;
    width: 280px;
    height: 45px;
    z-index: 1;
    font-size: 18px;
    font-weight: 500;
    color: #ffffff;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .field-mobile {
    position: absolute;
    left: 1180px;
    top: 535px;
    width: 280px;
    height: 45px;
    z-index: 1;
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .field-ticketid {
    position: absolute;
    left: 760px;
    top: 790px;
    width: 260px;
    height: 55px;
    z-index: 1;
    font-family: 'Inter', 'Courier New', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: rgba(212, 168, 83, 0.85);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ═══ QR CODE — EXACT COORDINATES ═══ */

  .qr-overlay {
    position: absolute;
    left: 740px;
    top: 475px;
    width: 210px;
    height: 210px;
    z-index: 1;
    background: #ffffff;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .qr-overlay img {
    display: block;
    width: 198px;
    height: 198px;
  }

  /* ═══ BARCODE — EXACT COORDINATES ═══ */

  .barcode-overlay {
    position: absolute;
    left: 734px;
    top: 839px;
    width: 252px;
    height: 82px;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .barcode-overlay img {
    display: block;
    width: 252px;
    height: 82px;
    object-fit: contain;
  }

  /* ═══ HIDE HELPER ═══ */
  .hide { display: none !important; }
</style>
</head>
<body>

  <!-- ██ ARTWORK BACKGROUND from brand assets ██ -->
  <img class="bg" src="{{BACKGROUND_BASE64}}" alt="Ticket Artwork" />

  <!-- ══════════════════════════════════════════════ -->
  <!--  ATTENDEE INFORMATION — EXACT COORDINATES    -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Attendee Name -->
  <div class="field-name">{{ATTENDEE_NAME}}</div>

  <!-- Attendee Gender -->
  <div class="field-gender">{{ATTENDEE_GENDER}}</div>

  <!-- Attendee Email -->
  <div class="field-email">{{ATTENDEE_EMAIL}}</div>

  <!-- Attendee Mobile -->
  <div class="field-mobile">{{ATTENDEE_MOBILE}}</div>

  <!-- Ticket ID -->
  <div class="field-ticketid">{{TICKET_ID}}</div>

  <!-- ══════════════════════════════════════════════ -->
  <!--  QR CODE & BARCODE — EXACT COORDINATES       -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- QR Code -->
  <div class="qr-overlay">
    <img src="data:image/png;base64,{{QR_BASE64}}" alt="QR" />
  </div>

  <!-- Barcode -->
  <div class="barcode-overlay">
    <img src="{{BARCODE_BASE64}}" alt="Barcode" />
  </div>

</body>
</html>
